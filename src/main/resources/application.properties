spring.application.name=MoveSmart

server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/movesmart?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=fiap

api.security.token.secret=${JWT_SECRET:12345678}

sptrans.url=https://api.olhovivo.sptrans.com.br/v2.1
sptrans.token=${SPTRANS_TOKEN:}
sptrans.timeout-ms=5000

api.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8081

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
